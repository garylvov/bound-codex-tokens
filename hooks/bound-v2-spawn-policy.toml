# Copy this block into a session-specific Codex hook configuration.  The path
# below must point to the installed v2_spawn_policy.py on this machine.

[[PreToolUse]]
matcher = "^spawn_agent$"

[[PreToolUse.hooks]]
type = "command"
command = "python3 /REPLACE/WITH/v2_spawn_policy.py"
timeout = 5
statusMessage = "checking v2 subagent policy"
